# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = Ubuntu Sans
$font_color = rgba(235, 219, 178, 1)

#shadow settings
$shadow_passes = 1
$shadow_size = 5
$shadow_color = rgba(60, 56, 54, 1)
$shadow_boost = 0.7

general {
    hide_cursor = true
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $NIXOS_CONFIG/hm-users/mathewelhans/config/hyprlock/wallpapers/wallpaper_2.jpg
    blur_passes = 0
    blur_size = 1
    brightness = 0.70
}

input-field {
    monitor =
    size = 19.6%, 4.6%
    outline_thickness = 2
    inner_color = rgba(29, 32, 33, 1) # no fill

    outer_color = rgba(142, 192, 124, 1)
    check_color = rgba(142, 192, 124, 1) rgba(251, 73, 52, 1) 120deg
    fail_color = rgba(251, 73, 52, 1) rgba(204, 36, 29, 1) 40deg
    capslock_color = rgba(214, 93, 14, 1)

    fade_on_empty = false
    rounding = 15

    font_family = Hasklug Nerd Font Mono
    font_color = $font_color

    placeholder_text = enter the passcode
    fail_text = $PAMFAIL$FPRINTFAIL

    # uncomment if you wish to display a message during authentication
    # check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    dots_size = 0.2
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 70
    halign = center
    valign = bottom
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 20
    font_family = NewComputerModern10 Bold
    color = $font_color

    shadow_passes = $shadow_passes
    shadow_size = $shadow_size
    shadow_color = $shadow_color
    shadow_boost = $shadow_boost

    position = 0, -80
    halign = center
    valign = top
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 80
    font_family = Hasklug Nerd Font Mono Bold
    color = $font_color

    shadow_passes = $shadow_passes
    shadow_size = $shadow_size
    shadow_color = $shadow_color
    shadow_boost = $shadow_boost

    position = 0, -110
    halign = center
    valign = top
}

# user
label {
    monitor =
    text = Hello, $USER
    font_size = 15
    font_family = Hasklug Nerd Font
    color = $font_color

    shadow_passes = $shadow_passes
    shadow_size = $shadow_size
    shadow_color = $shadow_color
    shadow_boost = $shadow_boost

    position = 0, 250
    halign = center
    valign = bottom
}

#user Image
image {
    monitor =
    path = $NIXOS_CONFIG/hm-users/mathewelhans/config/hyprlock/assets/user_default.png
    size = 70
    rounding = -1
    border_size = 2

    position = 0, 130
    halign = center
    valign = bottom
}

#Keyboard language
image {
    monitor =
    path = $NIXOS_CONFIG/hm-users/mathewelhans/config/hyprlock/assets/keyboard.png
    onclick = hyprctl switchxkblayout all next
    size = 20
    rounding = 0
    border_size = 0

    shadow_passes = $shadow_passes
    shadow_size = $shadow_size
    shadow_color = $shadow_color
    shadow_boost = $shadow_boost

    position = -64, -9
    halign = right
    valign = top
}

label {
    monitor =
    text = $LAYOUT[en,ru]
    font_size = 12
    font_family = Hasklug Nerd Font Mono
    color = $font_color

    position = -40, -7
    halign = right
    valign = top
}

#Wifi status
image {
    monitor =
    path = $NIXOS_CONFIG/hm-users/mathewelhans/config/hyprlock/assets/wifi/wifi-status.png
    size = 18
    rounding = 0
    border_size = 0

    shadow_passes = $shadow_passes
    shadow_size = $shadow_size
    shadow_color = $shadow_color
    shadow_boost = $shadow_boost

    position = -10, -9
    halign = right
    valign = top
}

#Battery status
label {
    monitor =
    text = cmd[update:1000] printf '%s%%\n' "$(cat /sys/class/power_supply/BAT0/capacity)"
    font_size = 10
    font_family = Hasklug Nerd Font Mono Bold
    color = $font_color

    position = 36, -8
    halign = left
    valign = top
}

image {
    monitor =
    path = $NIXOS_CONFIG/hm-users/mathewelhans/config/hyprlock/assets/battery/battery-status.png
    size = 19
    rounding = 0
    border_size = 0

    shadow_passes = $shadow_passes
    shadow_size = $shadow_size
    shadow_color = $shadow_color
    shadow_boost = $shadow_boost

    position = 13, -8
    halign = left
    valign = top
}