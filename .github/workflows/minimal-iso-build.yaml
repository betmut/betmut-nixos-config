name: Test minimal-iso build

on: [push, pull_request]

jobs:
  test-macos-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build minimal-iso system derivation
        # Targets your packages.x86_64-linux.minimal-iso attribute
        run: nix build .#nixosConfigurations.mySystem